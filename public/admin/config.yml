
backend:
  name: git-gateway
  branch: main

media_folder: public/images
public_folder: /images

collections:
  - name: bulletins
    label: Bulletins
    folder: src/content/bulletins
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: PDF, name: pdf, widget: file, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: parish_settings
    label: Mass & Parish Information
    files:
      - name: schedule
        label: Mass, Confession & Office
        file: src/data/parish-info.json
        fields:
          - label: Mass Schedule
            name: mass_schedule
            widget: list
            fields:
              - { label: Day, name: day, widget: string }
              - { label: Time, name: time, widget: string }

          - label: Confession Schedule
            name: confession_schedule
            widget: list
            fields:
              - { label: Day, name: day, widget: string }
              - { label: Time, name: time, widget: string }

          - { label: Confession Notes, name: confession_notes, widget: string, required: false }
          - { label: Office Address, name: office_address, widget: string }
          - { label: City and ZIP, name: office_city, widget: string }
          - { label: Office Phone, name: office_phone, widget: string }
          - { label: Office Hours, name: office_hours, widget: text, required: false }

  - name: parish_team
    label: Parish Team
    files:
      - name: team
        label: Team Members
        file: src/data/team.json
        fields:
          - label: Team Members
            name: members
            widget: list
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Position, name: role, widget: string }
              - { label: Phone, name: phone, widget: string, required: false }
              - { label: Email, name: email, widget: string, required: false }
              - { label: Notes, name: notes, widget: string, required: false }
              - { label: Photo, name: photo, widget: image, required: false }
